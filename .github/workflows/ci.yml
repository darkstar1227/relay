name: Validate relay

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  core-validation:
    uses: ./.github/workflows/core.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run build:check
      # /bin/bash on the macOS runner checks the Bash 3.2 runtime contract.
      - run: /bin/bash --version
      - run: npm test
      - run: git diff --exit-code

  package:
    needs: [test, core-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run test:package -- --pack-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: relay-npm
          path: dist/*.tgz
          if-no-files-found: error

  installed-package:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['16', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: relay-npm
          path: dist
      - name: Verify the same tarball on every runtime
        shell: bash
        run: |
          for tarball in dist/*.tgz; do
            npm run test:package -- --tarball "$tarball"
          done
