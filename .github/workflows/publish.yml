name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check release tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          name: relay-npm
          path: dist
      - name: Publish validated tarball
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
